name: Install Instructions

# Follows the README / docs installation steps on Linux, macOS and Windows, the way a user would,
# to catch instructions that stop working. The only deviation from the docs is that the CLI
# is installed from this checkout instead of git+https://github.com/...main, so a PR is
# tested with its own code.
#
# "Open a new terminal" steps start a shell that doesn't inherit the runner's PATH, so they
# only pass if `pipx ensurepath` really made `algebras` reachable for the user.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.distro.image }} (${{ matrix.method }})
    runs-on: ubuntu-latest
    container: ${{ matrix.distro.image }}
    strategy:
      fail-fast: false
      matrix:
        # pip: whether the README says plain `pip install` works there or is blocked by PEP 668
        distro:
          - { image: 'debian:12', pip: blocked }
          - { image: 'ubuntu:24.04', pip: blocked }
          - { image: 'ubuntu:22.04', pip: works }
          - { image: 'fedora:42', pip: works }
          - { image: 'archlinux:latest', pip: blocked }
        method: [pipx, venv, pip]
    defaults:
      run:
        shell: bash
    steps:
    # A desktop install has Python, pip, Git and sudo, and a normal user to run commands as
    - name: Prepare a user machine
      run: |
        if command -v apt-get >/dev/null; then
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip git sudo tzdata >/dev/null
          echo 'APT::Get::Assume-Yes "true";' > /etc/apt/apt.conf.d/90yes
          echo "PKG=apt" >> "$GITHUB_ENV"
        elif command -v dnf >/dev/null; then
          dnf install -y -q python3 python3-pip git sudo >/dev/null
          echo "assumeyes=True" >> /etc/dnf/dnf.conf
          echo "PKG=dnf" >> "$GITHUB_ENV"
        else
          pacman -Sy --noconfirm --needed python python-pip git sudo >/dev/null
          echo "PKG=pacman" >> "$GITHUB_ENV"
        fi
        useradd -m -s /bin/bash dev
        echo "dev ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/dev

    - uses: actions/checkout@v5

    - name: Copy the checkout into the user's home
      run: |
        cp -r "$GITHUB_WORKSPACE" /home/dev/algebras-cli
        chown -R dev:dev /home/dev/algebras-cli

    # The README commands for this distro, written to a script and run as the user
    - name: Install as the README describes
      run: |
        {
          case "${{ matrix.method }}" in
            pipx)
              case "$PKG" in
                apt) echo 'sudo apt update'; echo 'sudo apt install pipx' ;;
                dnf) echo 'sudo dnf install pipx' ;;
                pacman) echo 'sudo pacman -S python-pipx' ;;
              esac
              echo 'pipx ensurepath'
              echo 'pipx install ~/algebras-cli' ;;
            venv)
              if [ "$PKG" = apt ]; then echo 'sudo apt install python3-venv'; fi
              echo 'python3 -m venv ~/.venvs/algebras'
              echo 'source ~/.venvs/algebras/bin/activate'
              echo 'pip install ~/algebras-cli' ;;
            pip)
              echo 'pip install ~/algebras-cli' ;;
          esac
        } > /tmp/install.sh
        chmod 644 /tmp/install.sh
        # `yes` answers package manager prompts, as the user would
        set +e
        yes | su - dev -c 'bash -ex /tmp/install.sh' 2>&1 | tee /tmp/install.log
        status=${PIPESTATUS[1]}
        set -e
        if [ "${{ matrix.method }}" = pip ] && [ "${{ matrix.distro.pip }}" = blocked ]; then
          if [ "$status" -eq 0 ] || ! grep -q "externally-managed-environment" /tmp/install.log; then
            echo "Expected plain pip to be blocked with externally-managed-environment"; exit 1
          fi
          echo "Plain pip is blocked, as the README says"
        else
          exit "$status"
        fi

    - name: Open a new terminal and run algebras --version
      if: matrix.method != 'pip' || matrix.distro.pip == 'works'
      run: |
        case "${{ matrix.method }}" in
          venv) activate='source ~/.venvs/algebras/bin/activate'; expected=/home/dev/.venvs/algebras/bin/algebras ;;
          *) activate=':'; expected=/home/dev/.local/bin/algebras ;;
        esac
        # su - starts a fresh login shell with the user's own PATH and shell config
        su - dev -c "set -e; $activate; algebras --version; [ \"\$(command -v algebras)\" = $expected ] \
          || { echo \"algebras resolved to \$(command -v algebras), expected $expected\"; exit 1; }"

  macos:
    name: macOS (${{ matrix.method }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        method: [pipx, venv]
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # README "Using pipx": brew install pipx, pipx ensurepath, pipx install
    - name: Install with pipx
      if: matrix.method == 'pipx'
      run: |
        # Run in a clean login zsh (macOS's default shell) rather than the runner's shell: the
        # runner's PATH and PIPX_* variables would make ensurepath skip work a user's machine needs.
        # Only Homebrew is put on PATH, as it is for anyone who followed Homebrew's install steps.
        # shellcheck disable=SC2016  # expanded by the new shell, not this one
        env -i HOME="$HOME" USER="$USER" TERM=xterm-256color SHELL=/bin/zsh HOMEBREW_NO_AUTO_UPDATE=1 \
          PATH="$(brew --prefix)/bin:/usr/bin:/bin:/usr/sbin:/sbin" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
          /bin/zsh -l -c '
            set -e
            brew install pipx
            pipx ensurepath
            pipx install "$GITHUB_WORKSPACE"
          '
        echo "PATH entries ensurepath left in shell config files:"
        grep -Hn "local/bin" ~/.zshrc ~/.zprofile ~/.bashrc ~/.bash_profile ~/.profile 2>/dev/null || echo "(none)"

    - name: Open a new terminal and run algebras --version
      if: matrix.method == 'pipx'
      run: |
        # shellcheck disable=SC2016  # expanded by the new shell, not this one
        env -i HOME="$HOME" USER="$USER" TERM=xterm-256color PATH=/usr/bin:/bin:/usr/sbin:/sbin \
          /bin/zsh -l -i -c '
            set -e
            algebras --version
            [[ "$(command -v algebras)" == "$HOME/.local/bin/algebras" ]] || {
              echo "algebras resolved to $(command -v algebras), expected $HOME/.local/bin/algebras"; exit 1; }
          '

    # README "Using a virtual environment"
    - name: Install into a virtual environment
      if: matrix.method == 'venv'
      run: |
        python3 -m venv ~/.venvs/algebras
        # shellcheck source=/dev/null
        source ~/.venvs/algebras/bin/activate
        pip install "$GITHUB_WORKSPACE"

    - name: Open a new terminal, activate and run algebras --version
      if: matrix.method == 'venv'
      run: |
        env -i HOME="$HOME" USER="$USER" TERM=xterm-256color PATH=/usr/bin:/bin:/usr/sbin:/sbin \
          /bin/zsh -l -i -c '
            set -e
            source ~/.venvs/algebras/bin/activate
            algebras --version
          '

  windows:
    name: Windows (${{ matrix.method }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        method: [pipx, venv]
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # README "Installing pipx on Windows", Option 1, then the pipx install
    - name: Install with pipx
      if: matrix.method == 'pipx'
      run: |
        # Runner images ship their own pipx setup; a user's machine doesn't have it
        Remove-Item Env:PIPX_HOME, Env:PIPX_BIN_DIR, Env:PIPX_MAN_DIR -ErrorAction SilentlyContinue
        python -m pip install --user pipx
        python -m pipx ensurepath
        python -m pipx install $env:GITHUB_WORKSPACE
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Open a new terminal and run algebras --version
      if: matrix.method == 'pipx'
      run: |
        # A new terminal reads PATH from the registry, which is where ensurepath writes it
        $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
                    [Environment]::GetEnvironmentVariable('Path', 'User')
        algebras --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $resolved = (Get-Command algebras).Source
        $expected = Join-Path $HOME '.local\bin\algebras.exe'
        if ($resolved -ne $expected) { Write-Error "algebras resolved to $resolved, expected $expected"; exit 1 }

    # Docs "Using a virtual environment", Windows tab
    - name: Install into a virtual environment
      if: matrix.method == 'venv'
      run: |
        python -m venv $HOME\.venvs\algebras
        & $HOME\.venvs\algebras\Scripts\Activate.ps1
        pip install $env:GITHUB_WORKSPACE
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Open a new terminal, activate and run algebras --version
      if: matrix.method == 'venv'
      run: |
        & $HOME\.venvs\algebras\Scripts\Activate.ps1
        algebras --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
